# Android build workflow: assembles debug and release APKs and uploads them as artifacts.
name: Android CI - Build APKs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Prepare Android keystore (decode and write key.properties if secrets provided)
        run: |
          set -euo pipefail
          # Check presence of the base64 keystore secret at runtime (secrets cannot be used directly in if: expressions)
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is set — creating release-keystore.jks and key.properties"
            # Decode base64 keystore (ensure the secret is a single-line base64 string)
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks
            # Write key.properties for Gradle signingConfig (expand secrets here)
            cat > key.properties <<EOF
storeFile=release-keystore.jks
storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
EOF
            # Confirm file was created (do not print secret contents)
            ls -l release-keystore.jks || true
          else
            echo "ANDROID_KEYSTORE_BASE64 not set; release APK will be unsigned (or built with existing local config)."
          fi

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn