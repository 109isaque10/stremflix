name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ created ]   # triggers on GitHub Release creation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'          # or specify your required version
          cache-read-only: false

      # Optional: Set up signing for release builds if secrets are provided
      - name: Decode Keystore for Release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Build Debug APKs
        run: gradle :app:assembleDebug :tv:assembleDebug

      - name: Build Release APKs
        run: gradle :app:assembleRelease :tv:assembleRelease
        env:
          # Pass signing configuration to Gradle (adjust property names to match your build.gradle)
          ORG_GRADLE_PROJECT_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # If you used the keystore file from secrets, point to it
          ORG_GRADLE_PROJECT_SIGNING_STORE_FILE: ${{ github.workspace }}/keystore.jks

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk
          if-no-files-found: warn   # Warn if release build failed (e.g., missing signing)

      - name: Attach Release APKs to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            tv/build/outputs/apk/release/*.apk
          generate_release_notes: true